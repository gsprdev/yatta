version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - exhaustive
    - misspell
  settings:
    exhaustive:
      # Enums are string types and the design has no interface-based unions
      # to check instead (docs/YATTA-ARCH.md, Testing). A switch with an
      # explicit default has chosen its fallback; one without must cover
      # every value.
      default-signifies-exhaustive: true
    errcheck:
      exclude-functions:
        # Rollback after a failed or committed transaction is deferred cleanup.
        - (*database/sql.Tx).Rollback
    staticcheck:
      # The stock set, minus ST1005: error strings here begin with a remote
      # system's proper noun ("Jira ...", "Redmine ...").
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    depguard:
      rules:
        core-stdlib-only:
          # internal/core imports only the standard library (CLAUDE.md).
          files:
            - "**/internal/core/**"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
  exclusions:
    presets:
      - std-error-handling # deferred Close and friends
    rules:
      # The gate exists for the domain enums (Phase, Direction, BelowMin,
      # AggKey). UI state switches route a few states and leave the rest
      # to fall through by design.
      - path: internal/ui/
        linters:
          - exhaustive
      - path: _test\.go
        linters:
          - errcheck # test doubles write and decode without checking

formatters:
  enable:
    - gofmt
