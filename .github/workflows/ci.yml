name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names
      # the release. Dependabot (.github/dependabot.yml) keeps both current.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # Module downloads, compiled packages (modernc.org/sqlite is slow to
          # build), and golangci-lint's analysis cache.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          # mise itself is pinned too; the tools it installs are locked by mise.lock.
          version: 2026.9.16
      - run: mise run check
      - run: mise run build
