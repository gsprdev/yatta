name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names
      # the release. Dependabot (.github/dependabot.yml) keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Module downloads, compiled packages (modernc.org/sqlite is slow to
          # build), and golangci-lint's analysis cache.
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # mise itself is pinned too; the tools it installs are locked by mise.lock.
          version: 2026.9.16
      - run: mise run check
      - run: mise run build
